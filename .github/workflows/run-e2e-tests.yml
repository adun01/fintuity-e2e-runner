name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - preprod
      spec:
        description: 'Test spec (optional, leave empty to run all tests)'
        required: false
        type: string

jobs:
  # Один заранее выданный BO advisor access token на весь matrix прогон.
  # Все параллельные ранеры используют его, никто не логинится параллельно
  # (иначе на бэке `oauth_access_token.authentication_id = client_id+scope+username`
  # общий для всех, и каждый новый login удаляет чужой токен → 401 каскад).
  # client_id=fintuity-e2e имеет 2h TTL на бэке — заведомо дольше любого прогона.
  prep-bo-token:
    runs-on: ubuntu-latest
    outputs:
      bo_token: ${{ steps.mint.outputs.token }}
    steps:
      - id: mint
        env:
          BO_USER_EMAIL: ${{ secrets.BO_USER_EMAIL }}
          BO_USER_PASSWORD: ${{ secrets.BO_USER_PASSWORD }}
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          API_URL="https://app.${ENVIRONMENT}.fintuity.com"

          # Spring OAuth DefaultTokenServices при password grant НЕ создаёт
          # новый access token если для (client_id, scope, username) уже есть
          # неистёкший — возвращает существующий, а expires_in считается как
          # remaining time. Значит второй prep-job подряд мог бы получить
          # токен с 1-минутным TTL. Обход: сначала получить текущий (пусть
          # даже старый), revoke его, затем получить свежий с полным 2h TTL.
          get_token() {
            curl -sS -X POST "$API_URL/oauth/token" \
              -H 'content-type: application/x-www-form-urlencoded' \
              -d 'grant_type=password' \
              -d 'scope=global' \
              -d 'account_type=User' \
              -d 'client_id=fintuity-e2e' \
              --data-urlencode "username=$BO_USER_EMAIL" \
              --data-urlencode "password=$BO_USER_PASSWORD"
          }

          OLD=$(get_token)
          OLD_TOKEN=$(echo "$OLD" | jq -r .access_token)
          if [ -z "$OLD_TOKEN" ] || [ "$OLD_TOKEN" = "null" ]; then
            echo "❌ Failed to fetch initial BO token"
            echo "Response: $OLD"
            exit 1
          fi
          echo "::add-mask::$OLD_TOKEN"

          curl -sS -o /dev/null -X POST "$API_URL/oauth/revoke-token" \
            -H "Authorization: Bearer $OLD_TOKEN"

          FRESH=$(get_token)
          TOKEN=$(echo "$FRESH" | jq -r .access_token)
          EXPIRES=$(echo "$FRESH" | jq -r .expires_in)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to mint fresh BO token after revoke"
            echo "Response: $FRESH"
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "✅ BO token minted (client_id=fintuity-e2e, expires_in=${EXPIRES}s)"

  e2e-tests:
    needs: prep-bo-token
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: booking-pages
            spec_pattern: "e2e/src/integration/groups/portal/booking-pages/*.cy.ts"
            year_offset: 0
          - group: booking-shared
            spec_pattern: "e2e/src/integration/groups/portal/booking-shared/*.cy.ts"
            year_offset: 1
          - group: booking-service
            spec_pattern: "e2e/src/integration/groups/portal/booking-service/*.cy.ts"
            year_offset: 2
          - group: booking-emails
            spec_pattern: "e2e/src/integration/groups/portal/booking-emails/*.cy.ts"
            year_offset: 3
          - group: auth
            spec_pattern: "e2e/src/integration/groups/portal/auth/**/*.cy.ts"
            year_offset: 4
          - group: goal-cards
            spec_pattern: "e2e/src/integration/groups/portal/goal-cards/by-goal-type/*.cy.ts"
            year_offset: 4
#          - group: kyc
#            spec_pattern: "e2e/src/integration/groups/portal/kyc/**/*.cy.ts"
#            year_offset: 5
          - group: health-check-sequential
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-sequential.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-single-client
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-single-client.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-navigation
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-navigation.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-roundtrip
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-roundtrip.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-fastpass
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-fastpass.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-route-guards
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-route-guards.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-toc
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-toc.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-too-hard
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-too-hard.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-end-flow
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-end-flow.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-ui
            spec_pattern: "e2e/src/integration/groups/portal/health-check/health-check-ui.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: health-check-auth-flow
            spec_pattern: "e2e/src/integration/groups/portal/health-check/auth-flow.cy.ts"
            year_offset: 6
            config_file: "cypress-hc.json"
          - group: financial-profile-quick-pass
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-quick-pass.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-fastpass-married
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-fastpass-married.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-fullpass-single-client
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-fullpass-single-client.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-fullpass-married
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-fullpass-married.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-navigation
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-navigation.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-journey
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-journey.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-from-goal
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-from-goal.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-leave-without-saving-fastpass
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-leave-without-saving-fastpass.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-send-for-review
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-send-for-review.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-expired-sections
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-expired-sections.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: financial-profile-income-dialogs
            spec_pattern: "e2e/src/integration/groups/portal/financial-profile/financial-profile-income-dialogs.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
          - group: bo-fp-leave-without-saving
            spec_pattern: "e2e/src/integration/groups/backoffice/financial-profile/bo-fp-leave-without-saving.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
            base_url: "https://app.dev.fintuity.com/admin"
          - group: bo-fp-save-empty-entity
            spec_pattern: "e2e/src/integration/groups/backoffice/financial-profile/bo-fp-save-empty-entity.cy.ts"
            year_offset: 7
            config_file: "cypress-hc.json"
            base_url: "https://app.dev.fintuity.com/admin"
          # bo-fp-notes / bo-fp-notes-guard / bo-fp-notes-on-every-entity отключены:
          # на фронте notes недавно переписали, тесты ещё не адаптированы.

    steps:
      - name: Clone repository from Bitbucket
        run: |
          git clone --depth 1 https://${{ secrets.BITBUCKET_USERNAME }}:${{ secrets.BITBUCKET_API_TOKEN }}@bitbucket.org/fintuity-team/e2e-tests.git project
          cd project
          git log -1 --oneline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'
          cache-dependency-path: project/package-lock.json

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('project/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        working-directory: project
        run: npm ci

      - name: Start IMAP Proxy Server
        working-directory: project
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          BO_USER_EMAIL: ${{ secrets.BO_USER_EMAIL }}
          BO_USER_PASSWORD: ${{ secrets.BO_USER_PASSWORD }}
        run: |
          # Перенаправляем stdout+stderr прокси в файл, чтобы потом видеть
          # каждую попытку чтения письма в imap-proxy.log (для диагностики
          # ранних падений на регистрации / получении токена).
          npm run imap-proxy > imap-proxy.log 2>&1 &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV

          echo "⏳ Waiting for proxy server..."
          for i in {1..10}; do
            if curl -s http://localhost:3100/health > /dev/null; then
              echo "✅ Proxy server is ready"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        id: tests
        continue-on-error: true
        working-directory: project
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          BO_USER_EMAIL: ${{ secrets.BO_USER_EMAIL }}
          BO_USER_PASSWORD: ${{ secrets.BO_USER_PASSWORD }}
          # Готовый access token BO advisor'а из prep-bo-token job — один на
          # весь matrix. plugins/index.js:getBoToken при наличии этой env
          # возвращает её без обращения к /oauth/token; cy.boLogin просто
          # кладёт этот токен в BoAuthToken localStorage.
          BO_ACCESS_TOKEN: ${{ needs.prep-bo-token.outputs.bo_token }}
          CYPRESS_BASE_URL: ${{ secrets.DEV_URL }}
          IMAP_PROXY_URL: http://localhost:3100
        run: |
          SPEC_ARG=""
          if [ -n "${{ inputs.spec }}" ]; then
            SPEC_ARG="--spec ${{ inputs.spec }}"
          else
            SPEC_ARG="--spec ${{ matrix.spec_pattern }}"
          fi

          CONFIG_ARG=""
          if [ -n "${{ matrix.config_file }}" ]; then
            CONFIG_ARG="--config-file ${{ matrix.config_file }}"
          fi

          # base_url override (BO тесты используют /admin, а e2e:portal:dev
          # ставит baseUrl на /portal). CLI --config baseUrl=X имеет высший
          # приоритет, перебивает и config file и значение из npm script.
          BASE_URL_ARG=""
          if [ -n "${{ matrix.base_url }}" ]; then
            BASE_URL_ARG="--config baseUrl=${{ matrix.base_url }}"
          fi

          npm run e2e:portal:${{ inputs.environment || 'dev' }} -- --headless $SPEC_ARG $CONFIG_ARG $BASE_URL_ARG --env "groupName=${{ matrix.group }},yearOffset=${{ matrix.year_offset }}" 2>&1 | \
            grep --line-buffered -v -E "CertVerifyProcBuiltin|ERROR: No matching issuer|Certificate i=|OU=Cypress Proxy Server Certificate|cert_verify_proc" | \
            tee cypress-output.log

          exit ${PIPESTATUS[0]}

      - name: Stop IMAP Proxy Server
        if: always()
        run: |
          if [ -n "${{ env.PROXY_PID }}" ]; then
            echo "🛑 Stopping proxy server..."
            curl -s -X POST http://localhost:3100/close || true
            kill ${{ env.PROXY_PID }} || true
          fi

      - name: Parse test results
        if: always()
        working-directory: project
        run: |
          if [ ! -f "cypress-output.log" ]; then
            echo "ERROR: cypress-output.log not found!"
            exit 1
          fi

          cat cypress-output.log | sed -r "s/\x1B\[([0-9]{1,3}(;[0-9]{1,2})?)?[mGKHf]//g" > cypress-clean.log

          FULL_SUMMARY=$(grep -A 1000 "(Run Finished)" cypress-clean.log | tail -n +2)
          echo "$FULL_SUMMARY" > summary-full.txt

          SUMMARY_SHORT=$(echo "$FULL_SUMMARY" | grep "All specs passed\|of.*failed" | tail -1)
          echo "$SUMMARY_SHORT" > summary-short.txt

          TOTAL_SPECS=$(echo "$FULL_SUMMARY" | grep -c "│ ✔\|│ ✘" || echo "0")
          echo "$TOTAL_SPECS" > total-specs.txt

          if grep -q "1 failing" cypress-clean.log; then
            ERROR_DETAILS=$(grep -A 1000 "1 failing" cypress-clean.log | grep -B 1000 "\[fail-fast\]" | head -n -1)
            echo "$ERROR_DETAILS" > error-details.txt
          else
            echo "" > error-details.txt
          fi

          cp cypress-clean.log cypress-output.log

      - name: Send results to Telegram
        if: always()
        working-directory: project
        run: |
          SUMMARY_SHORT=$(cat summary-short.txt)
          TOTAL_SPECS=$(cat total-specs.txt)

          if grep -q "All specs passed!" cypress-output.log; then
            STATUS="✅ PASSED"
            TARGET_TOPIC_ID="${{ secrets.TELEGRAM_TOPIC_SUCCESS_ID }}"
            HEADER="──────── Run #${{ github.run_number }} (${{
              inputs.environment || 'dev'
            }}) / group: ${{ matrix.group }} ────────"
            TEXT="$HEADER%0A%0A🚀 <b>Группа запущена</b>%0AГруппа: <code>${{ matrix.group }}</code>%0AОкружение: <code>${{ inputs.environment || 'dev' }}</code>%0A%0A$STATUS <b>Прошла!</b>%0A%0A📊 <b>Результаты:</b>%0A<pre>$SUMMARY_SHORT</pre>%0AСпецификаций: <b>$TOTAL_SPECS</b>"
          else
            STATUS="❌ FAILED"
            TARGET_TOPIC_ID="${{ secrets.TELEGRAM_TOPIC_FAILED_ID }}"
            HEADER="──────── Run #${{ github.run_number }} (${{
              inputs.environment || 'dev'
            }}) / group: ${{ matrix.group }} ────────"
            TOTAL_FAILED=$(find screenshots -name "*failed*.png" 2>/dev/null | wc -l || echo "0")
            TEXT="$HEADER%0A%0A🚀 <b>Группа запущена</b>%0AГруппа: <code>${{ matrix.group }}</code>%0AОкружение: <code>${{ inputs.environment || 'dev' }}</code>%0A%0A$STATUS <b>Упала!</b>%0A%0A📊 <b>Результаты:</b>%0A<pre>$SUMMARY_SHORT</pre>%0AСпецификаций: <b>$TOTAL_SPECS</b>%0AУпало: <b>$TOTAL_FAILED</b>%0A%0A📸 Файлы ниже ⬇️"
          fi

          RESPONSE=$(curl -s -X POST 'https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage' \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "message_thread_id=$TARGET_TOPIC_ID" \
            -d "text=$TEXT" \
            -d "parse_mode=HTML")

          MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.result.message_id')
          echo "MESSAGE_ID=$MESSAGE_ID" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────────────
      # Telegram delivery layout (новый порядок, чтобы не было каши):
      #
      #   📨 Summary message              ← MESSAGE_ID (reply-anchor)
      #     ↳ ⚠️ bad-statuses.json         (always, if non-empty)
      #     ↳ 📊 cypress-output.log         (на failure)
      #     ↳ 📨 gmail-debug.log            (на failure)
      #     ↳ 📨 imap-proxy.log             (на failure)
      #     ↳ 🧩 email-parse-failures.tar.gz (если есть)
      #     ↳ ❌ Test card #1: "<full test name>"   ← TEST_CARD_ID
      #          ↳ 📸 screenshot
      #          ↳ 🎥 video (один на spec, прикладывается к первому tесту)
      #          ↳ 📋 request-log JSON
      #          ↳ 🔁 direct-request-log JSON
      #     ↳ ❌ Test card #2: ...
      #
      # reply_to_message_id даёт Telegram'у визуальную связь "Reply to ...",
      # благодаря чему всё дерево держится одним блоком даже когда
      # параллельные matrix-группы пишут в тот же топик.
      # ─────────────────────────────────────────────────────────────────────

      - name: Send bad-statuses.json to Telegram (reply to summary)
        # Отправляем даже на зелёном прогоне — это файл "скрытых" 4xx/5xx,
        # которые проявлялись у проходящих тестов (FE мог их обработать
        # ретраями, но это сигнал к проверке). Отсутствие файла — норма.
        if: always() && env.MESSAGE_ID != ''
        working-directory: project
        run: |
          BAD_FILE="e2e/requests-logs/bad-statuses.json"
          if [ ! -f "$BAD_FILE" ]; then
            echo "ℹ️ bad-statuses.json не создан — пропускаем"
            exit 0
          fi
          COUNT=$(jq 'length' "$BAD_FILE" 2>/dev/null || echo 0)
          if [ "$COUNT" = "0" ]; then
            echo "ℹ️ bad-statuses.json пустой — пропускаем"
            exit 0
          fi
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            TOPIC="${{ secrets.TELEGRAM_TOPIC_FAILED_ID }}"
          else
            TOPIC="${{ secrets.TELEGRAM_TOPIC_SUCCESS_ID }}"
          fi
          echo "📤 Sending: $BAD_FILE ($COUNT bad statuses)"
          curl -s -X POST 'https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument' \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "message_thread_id=$TOPIC" \
            -F "reply_to_message_id=${{ env.MESSAGE_ID }}" \
            -F "document=@$BAD_FILE" \
            -F "caption=⚠️ [${{ matrix.group }}] bad-statuses.json ($COUNT × 4xx/5xx)"

      - name: Pack email-parse-failures (if any)
        # Дамп тел писем, на которых imap-proxy не смог извлечь код.
        # Каждый файл — JSON с subject/from/parts/digit-sequences/patterns-tried.
        # Если файлов больше одного — упаковываем в .tar.gz одним документом.
        if: always()
        working-directory: project
        id: parsefails
        run: |
          DIR="email-parse-failures"
          if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
            echo "ℹ️ нет parse-failures"
            exit 0
          fi
          COUNT=$(find "$DIR" -type f -name "*.json" | wc -l | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          tar -czf email-parse-failures.tar.gz -C "$DIR" .
          echo "📦 spaced $COUNT parse-failure dumps into archive"

      - name: Send run-level diagnostic files (failure only)
        if: steps.tests.outcome == 'failure' && env.MESSAGE_ID != ''
        working-directory: project
        run: |
          send_doc() {
            local file="$1" caption="$2"
            if [ ! -f "$file" ]; then
              echo "ℹ️ $file не найден — пропускаем"
              return
            fi
            echo "📤 Sending: $file"
            curl -s -X POST 'https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument' \
              -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F "message_thread_id=${{ secrets.TELEGRAM_TOPIC_FAILED_ID }}" \
              -F "reply_to_message_id=${{ env.MESSAGE_ID }}" \
              -F "document=@$file" \
              -F "caption=$caption"
            sleep 1
          }
          send_doc "cypress-output.log" "📊 [${{ matrix.group }}] Full Cypress log"
          send_doc "gmail-debug.log"    "📨 [${{ matrix.group }}] gmail-debug.log"
          send_doc "imap-proxy.log"     "📨 [${{ matrix.group }}] imap-proxy.log"
          if [ "${{ steps.parsefails.outputs.count }}" != "0" ] && [ -n "${{ steps.parsefails.outputs.count }}" ]; then
            send_doc "email-parse-failures.tar.gz" "🧩 [${{ matrix.group }}] email-parse-failures (${{ steps.parsefails.outputs.count }} dumps)"
          fi

      - name: Send per-failed-test artifacts (failure only)
        # Для каждого failed теста собираем единый "test card":
        #   1. Текстовое сообщение-шапка (reply_to summary) → ловим TEST_CARD_ID
        #   2. К TEST_CARD_ID прикладываем screenshot, video, request-log,
        #      direct-request-log.
        # Матчинг JSON-логов: берём первые 30 alphanumeric chars из имени
        # screenshot и из имени JSON и сравниваем. plugins/index.js пишет
        # JSON как sanitize(fullTitle).substring(0, 50)+_<ts>.json — это
        # тот же префикс, что у describe-пути в screenshot, поэтому 30 alnum
        # надёжно совпадают.
        if: steps.tests.outcome == 'failure' && env.MESSAGE_ID != ''
        working-directory: project
        run: |
          set -euo pipefail

          alnum_prefix() {
            # extract alphanumeric-only prefix of $1, then take first $2 chars
            printf '%s' "$1" | tr -cd '[:alnum:]' | cut -c1-"$2"
          }

          # Список уже использованных артефактов — чтобы одно видео не
          # прикреплялось к нескольким test card'ам, а JSON-лог не дублировался.
          USED_VIDEOS=""
          USED_LOGS=""

          MATRIX_GROUP="${{ matrix.group }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          TOPIC_ID="${{ secrets.TELEGRAM_TOPIC_FAILED_ID }}"
          ROOT_ID="${{ env.MESSAGE_ID }}"

          INDEX=0
          # Перечислим failed screenshots — это наш source of truth по
          # упавшим тестам.
          mapfile -t SCREENSHOTS < <(find screenshots -type f -name "*failed*.png" 2>/dev/null \
            | grep -v "before each hook" \
            | grep -v "after each hook" \
            | head -20)

          if [ "${#SCREENSHOTS[@]}" -eq 0 ]; then
            echo "ℹ️ failed screenshots не найдены"
            exit 0
          fi

          for screenshot in "${SCREENSHOTS[@]}"; do
            INDEX=$((INDEX + 1))

            # Достаём название теста: путь относительно screenshots/<spec>/,
            # basename без " (failed).png". Спек берём для матча видео.
            REL="${screenshot#screenshots/}"
            SPEC_PATH=$(dirname "$REL")          # e.g. groups/booking-service/service-id.cy.ts
            FILE_NAME=$(basename "$REL" .png)    # "<test-name> (failed)"
            TEST_NAME="${FILE_NAME%% (failed)*}" # "<test-name>" в виде "A -- B -- C"
            TEST_NAME_HUMAN=$(printf '%s' "$TEST_NAME" | sed 's/ -- / › /g')

            # Префикс для матчинга JSON-логов
            TEST_KEY=$(alnum_prefix "$TEST_NAME" 30)

            echo "── [$INDEX] $TEST_NAME_HUMAN"
            echo "   spec=$SPEC_PATH key=$TEST_KEY"

            # 1) Test card message → ловим TEST_CARD_ID
            #    Используем reply_to_message_id чтобы card висел под summary.
            CARD_TEXT="❌ <b>Failed test #${INDEX}</b>%0A<b>Group:</b> <code>${MATRIX_GROUP}</code>%0A<b>Spec:</b> <code>${SPEC_PATH}</code>%0A<b>Test:</b> ${TEST_NAME_HUMAN}"

            CARD_RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "message_thread_id=${TOPIC_ID}" \
              -d "reply_to_message_id=${ROOT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${CARD_TEXT}")
            CARD_ID=$(printf '%s' "$CARD_RESP" | jq -r '.result.message_id // empty')

            if [ -z "$CARD_ID" ]; then
              echo "⚠️ failed to create test card: $CARD_RESP"
              CARD_ID="$ROOT_ID"  # fallback — клеим прямо к summary
            fi

            # 2) Screenshot → reply to card
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "message_thread_id=${TOPIC_ID}" \
              -F "reply_to_message_id=${CARD_ID}" \
              -F "photo=@${screenshot}" \
              -F "caption=📸 ${TEST_NAME_HUMAN}" >/dev/null || echo "⚠️ screenshot send failed"
            sleep 1

            # 3) Video (один на spec) → reply to card
            VIDEO_FILE="videos/${SPEC_PATH}.mp4"
            if [ -f "$VIDEO_FILE" ] && ! printf '%s\n' "$USED_VIDEOS" | grep -Fxq "$VIDEO_FILE"; then
              VIDEO_SIZE=$(stat -c%s "$VIDEO_FILE" 2>/dev/null || stat -f%z "$VIDEO_FILE" 2>/dev/null || echo 0)
              if [ "$VIDEO_SIZE" -gt 0 ] && [ "$VIDEO_SIZE" -lt 52428800 ]; then
                echo "   🎥 video: $VIDEO_FILE ($VIDEO_SIZE bytes)"
                curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
                  -F "chat_id=${CHAT_ID}" \
                  -F "message_thread_id=${TOPIC_ID}" \
                  -F "reply_to_message_id=${CARD_ID}" \
                  -F "video=@${VIDEO_FILE}" \
                  -F "caption=🎥 spec: $(basename "$VIDEO_FILE")" >/dev/null || echo "⚠️ video send failed"
                USED_VIDEOS="${USED_VIDEOS}"$'\n'"${VIDEO_FILE}"
                sleep 2
              else
                echo "   ⏭️  video skipped (size=$VIDEO_SIZE)"
              fi
            fi

            # 4) Request logs — match по alnum-префиксу имени
            for dir in e2e/requests-logs e2e/direct-requests-logs; do
              [ -d "$dir" ] || continue
              for jsonfile in "$dir"/*.json; do
                [ -f "$jsonfile" ] || continue
                BN=$(basename "$jsonfile" .json)
                # отрезаем суффикс _<unixms>
                BN_NOTS="${BN%_*}"
                JSON_KEY=$(alnum_prefix "$BN_NOTS" 30)
                if [ "$JSON_KEY" = "$TEST_KEY" ] && ! printf '%s\n' "$USED_LOGS" | grep -Fxq "$jsonfile"; then
                  if [ "$dir" = "e2e/requests-logs" ]; then
                    EMOJI="📋"
                    LABEL="request-log"
                  else
                    EMOJI="🔁"
                    LABEL="direct-request-log (cy.request)"
                  fi
                  echo "   $EMOJI log: $jsonfile"
                  curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
                    -F "chat_id=${CHAT_ID}" \
                    -F "message_thread_id=${TOPIC_ID}" \
                    -F "reply_to_message_id=${CARD_ID}" \
                    -F "document=@${jsonfile}" \
                    -F "caption=${EMOJI} ${LABEL}: $(basename "$jsonfile")" >/dev/null || echo "⚠️ log send failed"
                  USED_LOGS="${USED_LOGS}"$'\n'"${jsonfile}"
                  sleep 1
                fi
              done
            done
          done

      - name: Upload test artifacts
        # always: даже на зелёном прогоне поднимаем bad-statuses.json
        # (он собирается у всех тестов, включая прошедшие) и любые
        # email-parse-failures.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.group }}-${{ inputs.environment }}-${{ github.run_number }}
          path: |
            project/videos/
            project/screenshots/
            project/e2e/requests-logs/
            project/e2e/direct-requests-logs/
            project/email-parse-failures/
            project/cypress-output.log
            project/summary-full.txt
            project/error-details.txt
            project/gmail-debug.log
            project/imap-proxy.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
